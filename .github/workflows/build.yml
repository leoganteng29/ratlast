name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Initialize Project
        run: flutter create --platforms=android --org com.example --project-name rat_client .

      - name: Overwrite Main Dart
        run: cp main.dart lib/main.dart

      # IZINKAN HTTP (CLEARTEXT) KARENA PAKAI IP/HTTP
      - name: Allow Cleartext Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Gradle Version
        run: |
          sed -i '/versionCode flutter.versionCode/d' android/app/build.gradle
          sed -i '/versionName flutter.versionName/d' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
